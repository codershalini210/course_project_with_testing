<!DOCTYPE html>
<html>
<head>
    <title>Courses </title>
</head>
<body>
    <h1> Available Courses </h1>
    {% for course in courses %}
    <h2> 
        <a href={% url 'course_detail' course.pk %}>{{course.title}}</a>
    </h2>
    <p>{{course.description}}</p>
    {% empty %}
    <h2>No courses Available</h2>
    {% endfor%}
</body>
</html>
